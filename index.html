  <script>
    var _signer;
    function GetSigner(callback) {

        if (_signer) {
            callback(_signer);
            return;
        }

        _signer = new eSign.Signer();
      var signerSettings = new eSign.SignerSettings("ua");
      signerSettings.info = console.log;
      signerSettings.useOCSP = true;
      signerSettings.useOCSP = true;
      signerSettings.useCadesLong = true;
      signerSettings.enableDiviceKeys = true;
      signerSettings.KeyStorageType = 'Session'; // 'Session', //Storage



      _signer.initialize(signerSettings,
        function() {

          callback(_signer);
        });
        return;
    }

    function SignFileKep(newId, keyIdentity, okCallback, cancelCallback, errorCallBack) {

        GetSigner(function (signer) {

            var signItemRequest = new eSign.SignItemRequest();
          signItemRequest.requestedProviders = ['key', 'depositSign', 'diiaId', 'cloudKey', 'smartId'];

          signItemRequest.allowToSkipChooseKey = keyIdentity ? true : null;

          signItemRequest.keyIdentity = keyIdentity;
          signItemRequest.errorCallback = function (data) {

            if (errorCallBack) {

                errorCallBack(data); // Pass the data back to Dart
            }
           }
            signItemRequest.useCadesLong = true;

          signItemRequest.keys = [{ expectedEdrpou: "*", expectedDrfo:"*", identity: keyIdentity}];

            signItemRequest.okCallback = function (data) {
            if (okCallback) {

                okCallback(data); // Pass the data back to Dart
            }
        };
            signItemRequest.cancelCallback = cancelCallback;

            //signer.forgotPassword('comdoc');
            signer.signItem(newId, signItemRequest);
        });
    }
  </script>

  <script>
    function ShowSignatureInfo(itemId, okCallback) {
         GetSigner(function (signer) {
             signer.getSignatures(itemId, function (signatureInfo) {

                okCallback({
                "fullName" : signatureInfo.Signs[0].FullName,
                "edrpou" : signatureInfo.Signs[0].EDRPOU,
                "drfo" : signatureInfo.Signs[0].DRFO,
                "orgUnit" : signatureInfo.Signs[0].OrgUnit,
                "org" : signatureInfo.Signs[0].Org
                });

             });
         });
     }
  </script>


  <script>
    function ChangeCssMulti() {
         const dia = document.getElementById('diiaId');
         const cloud = document.getElementById('cloudKey');
         const smart = document.getElementById('smartId');
         dia.style.backgroundColor = '#a9a9a9';
         dia.style.pointerEvents = 'none';
         cloud.style.backgroundColor = '#a9a9a9';
         cloud.style.pointerEvents = 'none';
         smart.style.backgroundColor = '#a9a9a9';
         smart.style.pointerEvents = 'none';
         const depositSign = document.getElementById('depositSign');

      if (depositSign.classList.contains('selected-tab')) {
          if (depositSign) {
            depositSign.focus();
            depositSign.click();
          }
        } else {
      const key = document.getElementById('key');
        if (key) {
         key.focus();
         key.click();
        } else {
          if (depositSign) {
            depositSign.focus();
            depositSign.click();
          }
        }
      }

     }
  </script>
